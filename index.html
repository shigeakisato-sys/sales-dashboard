<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コーヒー小売サマリー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --page:        #f9f9f7;
    --surface:     #fcfcfb;
    --surface-2:   #f3f2ee;
    --ink:         #0b0b0b;
    --ink-2:       #52514e;
    --ink-muted:   #898781;
    --grid:        #e1e0d9;
    --axis:        #c3c2b7;
    --border:      rgba(11,11,11,0.10);
    --accent:      #2a78d6;
    --accent-soft: rgba(42,120,214,0.12);
    --cat-food:    #2a78d6;
    --cat-gift:    #eb6834;
    --cat-goods:   #1baf7a;
    --cat-sub:     #eda100;
    --critical:    #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:        #0d0d0d;
      --surface:     #1a1a19;
      --surface-2:   #212120;
      --ink:         #ffffff;
      --ink-2:       #c3c2b7;
      --ink-muted:   #898781;
      --grid:        #2c2c2a;
      --axis:        #383835;
      --border:      rgba(255,255,255,0.10);
      --accent:      #3987e5;
      --accent-soft: rgba(57,135,229,0.16);
      --cat-food:    #3987e5;
      --cat-gift:    #d95926;
      --cat-goods:   #199e70;
      --cat-sub:     #c98500;
      --critical:    #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:        #0d0d0d;
    --surface:     #1a1a19;
    --surface-2:   #212120;
    --ink:         #ffffff;
    --ink-2:       #c3c2b7;
    --ink-muted:   #898781;
    --grid:        #2c2c2a;
    --axis:        #383835;
    --border:      rgba(255,255,255,0.10);
    --accent:      #3987e5;
    --accent-soft: rgba(57,135,229,0.16);
    --cat-food:    #3987e5;
    --cat-gift:    #d95926;
    --cat-goods:   #199e70;
    --cat-sub:     #c98500;
    --critical:    #e66767;
  }

  * { box-sizing: border-box; }
  html, body {
    background: var(--page);
    color: var(--ink);
    margin: 0;
    font-family: "IBM Plex Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 24px 64px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  h1 { text-wrap: balance; }

  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .masthead h1 {
    font-family: Manrope, sans-serif;
    font-weight: 800;
    font-size: 22px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .masthead p {
    margin: 0;
    font-size: 13px;
    color: var(--ink-2);
  }
  .period-chip {
    font-size: 12px;
    color: var(--ink-2);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }

  .hero-row {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 16px;
  }
  .hero {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
  }
  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    text-transform: uppercase;
  }
  .hero-value {
    font-family: Manrope, sans-serif;
    font-weight: 800;
    font-size: 52px;
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .hero-sub {
    font-size: 13px;
    color: var(--ink-2);
  }

  .mini-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .mini-stat {
    background: var(--surface);
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
  }
  .mini-stat .label {
    font-size: 11.5px;
    color: var(--ink-muted);
  }
  .mini-stat .value {
    font-family: Manrope, sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 20px;
  }

  .card h2 {
    font-family: Manrope, sans-serif;
    font-weight: 700;
    font-size: 15px;
    margin: 0 0 2px;
    letter-spacing: -0.005em;
  }
  .card .card-note {
    font-size: 12px;
    color: var(--ink-muted);
    margin: 0 0 18px;
  }

  /* month column chart */
  .month-chart-wrap { width: 100%; overflow-x: auto; }
  .month-chart-wrap svg { width: 100%; height: auto; display: block; min-width: 420px; }
  .axis-label { font-size: 11px; fill: var(--ink-muted); font-family: "IBM Plex Sans JP", sans-serif; }
  .value-label { font-size: 12px; fill: var(--ink); font-weight: 600; font-family: "IBM Plex Sans JP", sans-serif; font-variant-numeric: tabular-nums; }
  .x-label { font-size: 12.5px; fill: var(--ink-2); font-family: "IBM Plex Sans JP", sans-serif; }

  /* bar list */
  .bar-list { display: flex; flex-direction: column; gap: 10px; }
  .bar-row {
    display: grid;
    grid-template-columns: 108px 1fr auto;
    align-items: center;
    gap: 12px;
  }
  .bar-row .name {
    font-size: 12.5px;
    color: var(--ink-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar-track {
    height: 20px;
    background: var(--surface-2);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    border-radius: 4px;
    min-width: 4px;
  }
  .bar-row .amount {
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    white-space: nowrap;
    text-align: right;
    min-width: 74px;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-2);
  }
  .legend-dot { width: 9px; height: 9px; border-radius: 2px; flex: none; }

  /* filter bar */
  .filter-bar {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 16px 24px;
  }
  .filter-group {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .filter-group.align-start { align-items: flex-start; }
  .filter-group + .filter-group {
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .filter-label {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--ink-muted);
    text-transform: uppercase;
    white-space: nowrap;
    padding-top: 8px;
  }
  .source-column { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 260px; }
  .segmented {
    display: inline-flex;
    flex-wrap: wrap;
    background: var(--surface-2);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .seg-btn {
    font-family: inherit;
    font-size: 12.5px;
    color: var(--ink-2);
    background: transparent;
    border: none;
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .seg-btn:hover { color: var(--ink); }
  .seg-btn.active {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--ink-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px 6px 10px;
    cursor: pointer;
    background: var(--surface);
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  .chip input { position: absolute; opacity: 0; width: 0; height: 0; }
  .chip:has(input:checked) {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--ink);
    font-weight: 600;
  }
  .chip-dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .source-chip-wrap { display: inline-flex; align-items: center; gap: 2px; }
  .chip-remove {
    border: none;
    background: transparent;
    color: var(--ink-muted);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .chip-remove:hover { color: var(--critical); background: var(--surface-2); }

  .dropzone {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 1.5px dashed var(--axis);
    border-radius: 10px;
    padding: 14px;
    font-size: 12.5px;
    color: var(--ink-muted);
    cursor: pointer;
    text-align: center;
    transition: border-color 0.12s ease, background 0.12s ease, color 0.12s ease;
  }
  .dropzone:hover { color: var(--ink-2); }
  .dropzone.dragover {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--ink);
  }
  .dropzone input { display: none; }

  .source-error {
    margin: 0;
    font-size: 12px;
    color: var(--critical);
  }

  .empty-state {
    margin: 0;
    padding: 32px 0;
    text-align: center;
    font-size: 13px;
    color: var(--ink-muted);
  }

  @media (max-width: 780px) {
    .hero-row { grid-template-columns: 1fr; }
    .mini-stats { grid-template-columns: repeat(3, 1fr); }
    .grid-2 { grid-template-columns: 1fr; }
    .hero-value { font-size: 42px; }
    .bar-row { grid-template-columns: 88px 1fr auto; }
    .filter-bar { gap: 14px; padding: 16px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <div>
      <h1>コーヒー小売サマリー</h1>
      <p id="masthead-note">読み込み中...</p>
    </div>
    <div class="period-chip" id="period-chip">—</div>
  </div>

  <div class="card filter-bar">
    <div class="filter-group align-start">
      <span class="filter-label">データソース</span>
      <div class="source-column">
        <div class="chip-group" id="source-chips"></div>
        <label class="dropzone" id="dropzone">
          <input type="file" id="file-input" accept=".csv" multiple>
          <span>📄 CSVをドラッグ&amp;ドロップ、またはクリックして選択(同じ列構成のファイルを複数可)</span>
        </label>
        <p class="source-error" id="source-error" hidden></p>
      </div>
    </div>
    <div class="filter-group">
      <span class="filter-label">期間</span>
      <div class="segmented" id="period-seg">
        <button class="seg-btn active" data-period="all">全期間</button>
      </div>
    </div>
    <div class="filter-group">
      <span class="filter-label">カテゴリ</span>
      <div class="chip-group" id="category-chips">
        <label class="chip"><input type="checkbox" value="食品" checked><span class="chip-dot" style="background:var(--cat-food)"></span>食品</label>
        <label class="chip"><input type="checkbox" value="ギフト" checked><span class="chip-dot" style="background:var(--cat-gift)"></span>ギフト</label>
        <label class="chip"><input type="checkbox" value="雑貨" checked><span class="chip-dot" style="background:var(--cat-goods)"></span>雑貨</label>
        <label class="chip"><input type="checkbox" value="サブスク" checked><span class="chip-dot" style="background:var(--cat-sub)"></span>サブスク</label>
      </div>
    </div>
  </div>

  <div class="card hero-row">
    <div class="hero">
      <span class="eyebrow">合計売上</span>
      <div class="hero-value" id="kpi-total">¥0</div>
      <span class="hero-sub" id="hero-sub">—</span>
    </div>
    <div class="mini-stats">
      <div class="mini-stat">
        <span class="label">総販売数量</span>
        <span class="value" id="kpi-qty">0</span>
      </div>
      <div class="mini-stat">
        <span class="label">取引件数</span>
        <span class="value" id="kpi-count">0</span>
      </div>
      <div class="mini-stat">
        <span class="label">平均客単価</span>
        <span class="value" id="kpi-avg">¥0</span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>月別推移</h2>
    <p class="card-note">月次の売上合計(円)</p>
    <div class="month-chart-wrap" id="month-chart"></div>
  </div>

  <div class="grid-2">
    <div class="card">
      <h2>商品別ランキング</h2>
      <p class="card-note">売上金額の高い順</p>
      <div class="bar-list" id="product-list"></div>
    </div>
    <div class="card">
      <h2>カテゴリ別売上</h2>
      <p class="card-note">4カテゴリの内訳</p>
      <div class="bar-list" id="category-list"></div>
    </div>
  </div>

  <div class="card">
    <h2>地域別売上</h2>
    <p class="card-note">売上金額の高い順</p>
    <div class="bar-list" id="region-list"></div>
  </div>
</div>

<script>
  const yen = n => "¥" + n.toLocaleString("ja-JP");
  const num = n => n.toLocaleString("ja-JP");
  const monthShort = ym => `${ym.slice(0, 4)}年${parseInt(ym.slice(5, 7), 10)}月`;

  const CAT_COLOR = {
    "食品": "var(--cat-food)",
    "ギフト": "var(--cat-gift)",
    "雑貨": "var(--cat-goods)",
    "サブスク": "var(--cat-sub)"
  };
  const EXPECTED_HEADER = ["日付", "商品名", "カテゴリ", "地域", "数量", "単価", "売上金額"];

  // 起動時に表示するサンプルデータ(1〜3月・405件)。同じ形式のCSVをドラッグすれば追加/差し替えできる。

,"r":"名古屋","q":4,"u":1800,"t":7200},{"d":"2026-03-29","p":"カフェオレベース","c":"食品","r":"札幌","q":3,"u":980,"t":2940},{"d":"2026-03-29","p":"定期便（月1）","c":"サブスク","r":"東京","q":2,"u":3600,"t":7200},{"d":"2026-03-29","p":"ドリップコーヒー12杯","c":"食品","r":"福岡","q":5,"u":1200,"t":6000},{"d":"2026-03-29","p":"タンブラー","c":"雑貨","r":"名古屋","q":1,"u":2800,"t":2800},{"d":"2026-03-29","p":"定期便（月1）","c":"サブスク","r":"大阪","q":3,"u":3600,"t":10800},{"d":"2026-03-29","p":"マグカップ","c":"雑貨","r":"東京","q":2,"u":1800,"t":3600},{"d":"2026-03-30","p":"ドリップコーヒー12杯","c":"食品","r":"東京","q":2,"u":1200,"t":2400},{"d":"2026-03-30","p":"コーヒー豆200g","c":"食品","r":"福岡","q":2,"u":1500,"t":3000},{"d":"2026-03-30","p":"定期便（月1）","c":"サブスク","r":"札幌","q":1,"u":3600,"t":3600},{"d":"2026-03-30","p":"タンブラー","c":"雑貨","r":"東京","q":1,"u":2800,"t":2800},{"d":"2026-03-30","p":"定期便（月1）","c":"サブスク","r":"福岡","q":1,"u":3600,"t":3600},{"d":"2026-03-31","p":"コーヒー豆200g","c":"食品","r":"大阪","q":3,"u":1500,"t":4500},{"d":"2026-03-31","p":"ドリップパックギフト","c":"ギフト","r":"福岡","q":3,"u":3200,"t":9600}];

  const selectedFiles = new Set([SAMPLE_FILENAME]);
  let ROWS = [];

  const selectedCategories = new Set(["食品", "ギフト", "雑貨", "サブスク"]);

  function parseCSV(text) {
    const clean = text.replace(/^﻿/, "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
    const lines = clean.split("\n").filter(l => l.length > 0);
    if (!lines.length) return { error: "空のファイルです" };

    const parseLine = line => {
      const out = [];
      let cur = "", inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (inQuotes) {
          if (ch === '"') {
            if (line[i + 1] === '"') { cur += '"'; i++; } else { inQuotes = false; }
          } else cur += ch;
        } else if (ch === '"') {
          inQuotes = true;
        } else if (ch === ",") {
          out.push(cur); cur = "";
        } else {
          cur += ch;
        }
      }
      out.push(cur);
      return out.map(v => v.trim());
    };

    const header = parseLine(lines[0]);
    if (header.length !== EXPECTED_HEADER.length || header.some((h, i) => h !== EXPECTED_HEADER[i])) {
      return { error: `列構成が一致しません(期待: ${EXPECTED_HEADER.join(",")})` };
    }

    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const f = parseLine(lines[i]);
      if (f.length !== 7) continue;
      const [d, p, c, r, q, u, t] = f;
      const qty = parseInt(q, 10), unit = parseInt(u, 10), total = parseInt(t, 10);
      if (!d || Number.isNaN(qty) || Number.isNaN(unit) || Number.isNaN(total)) continue;
      rows.push({ d, p, c, r, q: qty, u: unit, t: total });
    }
    if (!rows.length) return { error: "有効な行が見つかりませんでした" };
    return { rows };
  }

  function showSourceError(msg) {
    const el = document.getElementById("source-error");
    if (!msg) { el.hidden = true; el.textContent = ""; return; }
    el.hidden = false;
    el.textContent = "⚠ " + msg;
  }

  async function handleFiles(fileList) {
    const errors = [];
    for (const file of Array.from(fileList)) {
      if (!file.name.toLowerCase().endsWith(".csv")) {
        errors.push(`${file.name}: CSVファイルではありません`);
        continue;
      }
      let text;
      try {
        text = await file.text();
      } catch (e) {
        errors.push(`${file.name}: 読み込みに失敗しました`);
        continue;
      }
      const parsed = parseCSV(text);
      if (parsed.error) {
        errors.push(`${file.name}: ${parsed.error}`);
        continue;
      }
      loadedFiles.set(file.name, { rows: parsed.rows });
      selectedFiles.add(file.name);
    }
    showSourceError(errors.length ? errors.join(" / ") : null);
    renderSourceChips();
    reloadData();
  }

  function renderSourceChips() {
    const container = document.getElementById("source-chips");
    if (!loadedFiles.size) {
      container.innerHTML = '<p class="empty-state" style="padding:0;">CSVをドラッグ&ドロップして読み込んでください</p>';
      return;
    }
    container.innerHTML = [...loadedFiles.entries()].map(([name, info]) => {
      const dates = info.rows.map(r => r.d).sort();
      const range = dates.length ? `${dates[0]}〜${dates[dates.length - 1]}` : "—";
      const checked = selectedFiles.has(name) ? "checked" : "";
      const removeBtn = info.sample ? "" : `<button type="button" class="chip-remove" data-remove="${name}" title="削除">×</button>`;
      return `
        <span class="source-chip-wrap">
          <label class="chip">
            <input type="checkbox" data-file="${name}" ${checked}>
            <span class="chip-dot" style="background:var(--accent)"></span>
            ${name}(${info.rows.length}件・${range})
          </label>
          ${removeBtn}
        </span>`;
    }).join("");

    container.querySelectorAll("input[data-file]").forEach(cb => {
      cb.addEventListener("change", () => {
        const name = cb.dataset.file;
        if (cb.checked) selectedFiles.add(name); else selectedFiles.delete(name);
        reloadData();
      });
    });
    container.querySelectorAll("[data-remove]").forEach(btn => {
      btn.addEventListener("click", () => {
        const name = btn.dataset.remove;
        loadedFiles.delete(name);
        selectedFiles.delete(name);
        renderSourceChips();
        reloadData();
      });
    });
  }

  function reloadData() {
    ROWS = [];
    selectedFiles.forEach(name => {
      const info = loadedFiles.get(name);
      if (info) ROWS.push(...info.rows);
    });
    document.getElementById("masthead-note").textContent =
      `選択中のCSV ${selectedFiles.size}件・${ROWS.length}件の取引を集計`;
    buildPeriodButtons();
    updatePeriodChip();
    applyFilters();
  }

  function filteredRows() {
    return ROWS.filter(r =>
      (selectedPeriod === "all" || r.d.startsWith(selectedPeriod)) &&
      selectedCategories.has(r.c)
    );
  }

  function aggregate(rows) {
    const total = rows.reduce((s, r) => s + r.t, 0);
    const totalQty = rows.reduce((s, r) => s + r.q, 0);
    const count = rows.length;
    const avg = count ? Math.round(total / count) : 0;

    const sumBy = keyFn => {
      const map = new Map();
      rows.forEach(r => { const k = keyFn(r); map.set(k, (map.get(k) || 0) + r.t); });
      return map;
    };

    const byMonth = [...sumBy(r => r.d.slice(0, 7)).entries()]
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(([month, total]) => ({ month, total }));
    const byProduct = [...sumBy(r => r.p).entries()]
      .map(([name, total]) => ({ name, total })).sort((a, b) => b.total - a.total);
    const byCategory = [...sumBy(r => r.c).entries()]
      .map(([name, total]) => ({ name, total })).sort((a, b) => b.total - a.total);
    const byRegion = [...sumBy(r => r.r).entries()]
      .map(([name, total]) => ({ name, total })).sort((a, b) => b.total - a.total);

    return { total, totalQty, count, avg, byMonth, byProduct, byCategory, byRegion };
  }

  function renderBarListOrEmpty(containerId, rows, colorFn) {
    const el = document.getElementById(containerId);
    if (!rows.length) {
      el.innerHTML = '<p class="empty-state">該当するデータがありません</p>';
      return;
    }
    const max = Math.max(...rows.map(r => r.total));
    el.innerHTML = rows.map(r => {
      const pct = Math.max((r.total / max) * 100, 2);
      return `
        <div class="bar-row">
          <div class="name" title="${r.name}">${r.name}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${colorFn(r.name)}"></div></div>
          <div class="amount">${yen(r.total)}</div>
        </div>`;
    }).join("");
  }

  // "nice" axis ceiling so the scale adapts to however many months/files are combined
  function niceTicks(maxValue) {
    if (maxValue <= 0) return { step: 100000, top: 400000 };
    const rawStep = maxValue / 4;
    const magnitude = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const stepMultiples = [1, 2, 2.5, 5, 10];
    let step = magnitude * 10;
    for (const mult of stepMultiples) {
      if (magnitude * mult >= rawStep) { step = magnitude * mult; break; }
    }
    return { step, top: step * 4 };
  }

  function renderMonthChart(byMonth) {
    const container = document.getElementById("month-chart");
    if (!byMonth.length) {
      container.innerHTML = '<p class="empty-state">該当するデータがありません</p>';
      return;
    }
    const W = 640, H = 300;
    const marginLeft = 68, marginRight = 24, marginTop = 28, marginBottom = 36;
    const plotW = W - marginLeft - marginRight;
    const plotH = H - marginTop - marginBottom;
    const { step, top: maxVal } = niceTicks(Math.max(...byMonth.map(m => m.total)));
    const ticks = [0, step, step * 2, step * 3, step * 4];
    const bandW = plotW / byMonth.length;
    const barW = Math.min(28, bandW * 0.4);

    let gridSvg = "";
    ticks.forEach(t => {
      const y = marginTop + plotH - (t / maxVal) * plotH;
      gridSvg += `<line x1="${marginLeft}" y1="${y}" x2="${W - marginRight}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
      gridSvg += `<text class="axis-label" x="${marginLeft - 10}" y="${y + 4}" text-anchor="end">${num(Math.round(t))}</text>`;
    });

    let barsSvg = "";
    byMonth.forEach((m, i) => {
      const barH = (m.total / maxVal) * plotH;
      const x = marginLeft + i * bandW + (bandW - barW) / 2;
      const y = marginTop + plotH - barH;
      const label = parseInt(m.month.slice(5, 7), 10) + "月";
      barsSvg += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="4" fill="var(--accent)"/>`;
      barsSvg += `<text class="value-label" x="${x + barW / 2}" y="${y - 8}" text-anchor="middle">${yen(m.total)}</text>`;
      barsSvg += `<text class="x-label" x="${x + barW / 2}" y="${H - 10}" text-anchor="middle">${label}</text>`;
    });

    container.innerHTML =
      `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${gridSvg}${barsSvg}</svg>`;
  }

  function applyFilters() {
    const rows = filteredRows();
    const agg = aggregate(rows);

    document.getElementById("kpi-total").textContent = yen(agg.total);
    document.getElementById("kpi-qty").textContent = num(agg.totalQty) + "点";
    document.getElementById("kpi-count").textContent = num(agg.count) + "件";
    document.getElementById("kpi-avg").textContent = agg.count ? yen(agg.avg) : "—";
    document.getElementById("hero-sub").textContent =
      selectedPeriod === "all" ? "選択中のデータソースの全取引合計" : `${monthShort(selectedPeriod)}の取引合計`;

    renderMonthChart(agg.byMonth);
    renderBarListOrEmpty("product-list", agg.byProduct, () => "var(--accent)");
    renderBarListOrEmpty("category-list", agg.byCategory, name => CAT_COLOR[name] || "var(--accent)");
    renderBarListOrEmpty("region-list", agg.byRegion, () => "var(--accent)");
  }

  function buildPeriodButtons() {
    const months = [...new Set(ROWS.map(r => r.d.slice(0, 7)))].sort();
    const seg = document.getElementById("period-seg");
    seg.innerHTML = '<button class="seg-btn active" data-period="all">全期間</button>' +
      months.map(m => `<button class="seg-btn" data-period="${m}">${monthShort(m)}</button>`).join("");
    selectedPeriod = "all";
    seg.querySelectorAll(".seg-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        seg.querySelectorAll(".seg-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedPeriod = btn.dataset.period;
        applyFilters();
      });
    });
  }

  function updatePeriodChip() {
    const chip = document.getElementById("period-chip");
    if (!ROWS.length) { chip.textContent = "データなし"; return; }
    const dates = ROWS.map(r => r.d).sort();
    chip.textContent = `${dates[0]} 〜 ${dates[dates.length - 1]}`;
  }

  document.querySelectorAll("#category-chips input[type=checkbox]").forEach(cb => {
    cb.addEventListener("change", () => {
      if (cb.checked) selectedCategories.add(cb.value); else selectedCategories.delete(cb.value);
      applyFilters();
    });
  });

  // category legend (color identity supplements the direct label; stays visible regardless of filter)
  const legend = document.createElement("div");
  legend.className = "legend";
  legend.innerHTML = Object.entries(CAT_COLOR).map(([name, color]) =>
    `<span class="legend-item"><span class="legend-dot" style="background:${color}"></span>${name}</span>`
  ).join("");
  document.getElementById("category-list").after(legend);

  // drag & drop / file picker wiring
  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("file-input");
  fileInput.addEventListener("change", e => { handleFiles(e.target.files); fileInput.value = ""; });
  ["dragenter", "dragover"].forEach(evt => dropzone.addEventListener(evt, e => {
    e.preventDefault(); e.stopPropagation(); dropzone.classList.add("dragover");
  }));
  ["dragleave", "drop"].forEach(evt => dropzone.addEventListener(evt, e => {
    e.preventDefault(); e.stopPropagation(); dropzone.classList.remove("dragover");
  }));
  dropzone.addEventListener("drop", e => {
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
      handleFiles(e.dataTransfer.files);
    }
  });

  renderSourceChips();
  reloadData();
</script>
</body>
</html>
